apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sheeplet-wildcard
  namespace: nginx-system
spec:
  secretName: sheeplet-wildcard-tls
  # DuckDNS has one shared TXT value; a wildcard alone avoids competing challenges.
  dnsNames:
    - "*.sheeplet.duckdns.org"
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: duckdns-letsencrypt-prod
    kind: ClusterIssuer
