apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: duckdns-letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: duckdns-letsencrypt-staging-account
    solvers:
      - selector:
          dnsNames:
            - "*.sheeplet.duckdns.org"
        dns01:
          webhook:
            groupName: acme.sheeplet.duckdns.org
            solverName: duckdns
            config:
              apiTokenSecretRef:
                name: cert-manager-secrets
                key: token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
