spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: duckdns-letsencrypt-prod-account
    solvers:
      - selector:
          dnsNames:
            - "*.sheeplet.duckdns.org"
        dns01:
          webhook:
            groupName: acme.sheeplet.duckdns.org
            solverName: duckdns
            config:
              apiTokenSecretRef:
                name: cert-manager-secrets
                key: token
