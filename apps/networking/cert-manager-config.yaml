apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sheeplet1/homelab.git
    targetRevision: main
    path: apps/networking/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  # Production issuance follows a successful staging challenge.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
