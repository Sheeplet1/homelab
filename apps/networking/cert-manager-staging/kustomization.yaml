apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../cert-manager
patches:
  - target:
      kind: Certificate
      name: sheeplet-wildcard
    patch: |-
      - op: replace
        path: /spec/issuerRef/name
        value: duckdns-letsencrypt-staging
      - op: replace
        path: /spec/secretName
        value: sheeplet-wildcard-staging-tls
