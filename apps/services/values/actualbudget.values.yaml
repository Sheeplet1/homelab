files:
  server: /data/server-files
  user: /data/user-files

ingress:
  enabled: true
  className: nginx-internal
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - host: budget.sheeplet.duckdns.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    # The chart requires secretName; an empty value selects NGINX's default certificate.
    - secretName: ""
      hosts:
        - budget.sheeplet.duckdns.org

persistence:
  enabled: true
  existingClaim: actualbudget-pvc
