apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepacerr
  labels:
    app.kubernetes.io/name: onepacerr
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: onepacerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onepacerr
    spec:
      automountServiceAccountToken: false
      # The upstream image does not consume its documented PUID and PGID variables.
      # Kubernetes therefore sets the identity directly.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: onepacerr
          image: ghcr.io/eltharynd/onepacerr:v1.8.11
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: onepacerr
          env:
            - name: JELLYFIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: JELLYFIN_USERNAME
            - name: JELLYFIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: JELLYFIN_PASSWORD
            - name: TORRENT_USER
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: qbittorrent-username
            - name: TORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: qbittorrent-password
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: media
              mountPath: /data
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
