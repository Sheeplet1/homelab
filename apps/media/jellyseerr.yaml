apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyseerr
  namespace: argocd
spec:
  project: default
  sources:
    # Preserve the installed release after its upstream archive was removed.
    - repoURL: https://raw.githubusercontent.com/Sheeplet1/homelab/main/apps/media/charts
      chart: jellyseerr
      targetRevision: 3.0.1
      helm:
        releaseName: jellyseerr
        valueFiles:
          - $values/apps/media/values/jellyseerr.values.yaml
    - repoURL: https://github.com/Sheeplet1/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: jellyfin-media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - Prune=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 15m
